name: Check and package Observatory
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release retries preserve published assets
        run: |
          python3 scripts/test-upload-release.py
          python3 scripts/test-machine-helper-packaging.py
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev libclang-dev pkg-config build-essential cmake
      - name: Install Rust
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.93.0 fmt --check
      - run: cargo +1.93.0 test --locked
      - run: cargo +1.93.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.93.0 build --release --locked
      - name: Verify actual helper pairing over TLS
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          OBSERVATORY_BINARY: ${{ github.workspace }}/target/release/agent-observatory
          MACHINE_HELPER_BINARY: ${{ github.workspace }}/machine-helper/target/debug/constellation-machine-helper
        run: |
          cargo +1.93.0 build --manifest-path machine-helper/Cargo.toml --locked
          python3 machine-helper/tests/actual-server.py
      - uses: actions/setup-node@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          node-version: '22'
      - name: Check browser setup and conversation journeys
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          OBSERVATORY_BINARY: ${{ github.workspace }}/target/release/agent-observatory
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node tests/browser.mjs
          node tests/management-browser.mjs
          node tests/intake-browser.mjs
          node tests/markdown.mjs
          node tests/world-model.mjs
          node tests/world-browser.mjs
          node tests/machine-pairing-browser.mjs
      - name: Package standalone executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(target/release/agent-observatory --version | cut -d' ' -f2)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          mkdir dist
          archive="agent-observatory-$version-$TARGET.tar.gz"
          tar -czf "dist/$archive" -C target/release agent-observatory
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  machine-helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            executable: constellation-machine-helper
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            executable: constellation-machine-helper
          - runner: macos-15
            platform: macos-aarch64
            executable: constellation-machine-helper
          - runner: macos-15-intel
            platform: macos-x86_64
            executable: constellation-machine-helper
          - runner: windows-2025
            platform: windows-x86_64
            executable: constellation-machine-helper.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.93.0 fmt --manifest-path machine-helper/Cargo.toml --check
      - run: cargo +1.93.0 test --manifest-path machine-helper/Cargo.toml --locked
      - name: Prepare disposable Linux user service manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify current-user startup registration and removal
        env:
          CONSTELLATION_STARTUP_SMOKE: '1'
        run: cargo +1.93.0 test --manifest-path machine-helper/Cargo.toml --locked --test platform_startup -- --ignored --nocapture
      - run: cargo +1.93.0 clippy --manifest-path machine-helper/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.93.0 build --manifest-path machine-helper/Cargo.toml --release --locked
      - name: Package the native computer helper
        run: python3 machine-helper/packaging/package.py --binary "machine-helper/target/release/${{ matrix.executable }}" --platform "${{ matrix.platform }}" --version 0.1.0 --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-helper-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, machine-helper]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create draft release and attach verified builds
        run: |
          python3 scripts/package-machine-helpers.py --directory dist
          python3 scripts/upload-release.py --tag "$RELEASE_TAG" --directory dist
