name: Check and package Observatory
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observatory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            executable: agent-observatory
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            executable: agent-observatory
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            executable: agent-observatory
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            executable: agent-observatory
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            executable: agent-observatory.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-aarch64
            executable: agent-observatory.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      OBSERVATORY_RELEASE_BINARY: target/${{ matrix.target }}/release/${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check release retries preserve published assets
        if: runner.os == 'Linux'
        run: |
          python scripts/test-upload-release.py
          python scripts/test-machine-helper-packaging.py
          python scripts/test-machine-helper-imports.py
          python scripts/test-machine-helper-elf.py
          python scripts/test-native-packaging.py
      - name: Install prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev libclang-dev pkg-config build-essential cmake
      - name: Install Rust
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - name: Configure the native build target and static Windows CRT
        run: |
          rustup +1.93.0 target add "$CARGO_BUILD_TARGET"
          if [[ "${{ runner.os }}" == Windows ]]; then
            target_env="${CARGO_BUILD_TARGET//-/_}"
            echo "CARGO_TARGET_${target_env^^}_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          fi
          rustc +1.93.0 -vV
          python -c 'import platform; print(platform.platform(), platform.machine())'
      - run: cargo +1.93.0 fmt --check
      - run: cargo +1.93.0 test --locked
      - run: cargo +1.93.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.93.0 build --release --locked
      - name: Verify actual helper pairing over TLS
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          OBSERVATORY_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.executable }}
          MACHINE_HELPER_BINARY: ${{ github.workspace }}/machine-helper/target/${{ matrix.target }}/debug/constellation-machine-helper
        run: |
          cargo +1.93.0 build --manifest-path machine-helper/Cargo.toml --locked
          python machine-helper/tests/actual-server.py
      - uses: actions/setup-node@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          node-version: '22'
      - name: Check browser setup and conversation journeys
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          OBSERVATORY_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.executable }}
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node tests/desktop-browser.mjs
          node tests/browser.mjs
          node tests/management-browser.mjs
          node tests/intake-browser.mjs
          node tests/markdown.mjs
          node tests/world-model.mjs
          node tests/world-browser.mjs
          node tests/machine-pairing-browser.mjs
      - name: Verify Windows does not require a separate VC++ runtime
        if: runner.os == 'Windows'
        run: python scripts/check-machine-helper-imports.py --binary "$OBSERVATORY_RELEASE_BINARY" --platform "${{ matrix.platform }}"
      - name: Verify macOS imports only system frameworks and libraries
        if: runner.os == 'macOS'
        run: python scripts/check-native-macho.py --binary "$OBSERVATORY_RELEASE_BINARY" --architecture "${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}"
      - name: Package standalone application
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$("$OBSERVATORY_RELEASE_BINARY" --version | cut -d' ' -f2)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python scripts/package-observatory.py --binary "$OBSERVATORY_RELEASE_BINARY" --target "$TARGET" --version "$version" --output dist
      - name: Verify downloaded native app setup, restart and login
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for metadata in dist/agent-observatory-*-"$TARGET".*.json; do
            python scripts/check-native-launch.py --metadata "$metadata"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  machine-helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            executable: constellation-machine-helper
            build_target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            executable: constellation-machine-helper
            build_target: aarch64-unknown-linux-musl
          - runner: macos-15
            platform: macos-aarch64
            build_target: aarch64-apple-darwin
            executable: constellation-machine-helper
          - runner: macos-15-intel
            platform: macos-x86_64
            build_target: x86_64-apple-darwin
            executable: constellation-machine-helper
          - runner: windows-2025
            platform: windows-x86_64
            build_target: x86_64-pc-windows-msvc
            executable: constellation-machine-helper.exe
          - runner: windows-11-arm
            platform: windows-aarch64
            build_target: aarch64-pc-windows-msvc
            executable: constellation-machine-helper.exe
    runs-on: ${{ matrix.runner }}
    env:
      HELPER_RELEASE_BINARY: machine-helper/target/${{ matrix.build_target }}/release/${{ matrix.executable }}
      CARGO_BUILD_TARGET: ${{ matrix.build_target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Keep the Windows helper independent of a VC++ runtime install
        if: runner.os == 'Windows'
        run: |
          target_env="${CARGO_BUILD_TARGET//-/_}"
          echo "CARGO_TARGET_${target_env^^}_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - run: rustup +1.93.0 target add "$CARGO_BUILD_TARGET"
      - name: Keep the Linux helper independent of the host C library
        if: runner.os == 'Linux'
        env:
          HELPER_TARGET: ${{ matrix.build_target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup +1.93.0 target add "$HELPER_TARGET"
          target_env="${HELPER_TARGET//-/_}"
          echo "CARGO_BUILD_TARGET=$HELPER_TARGET" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${target_env^^}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${target_env^^}_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          echo "CC_${target_env}=musl-gcc" >> "$GITHUB_ENV"
          echo "HELPER_RELEASE_BINARY=machine-helper/target/$HELPER_TARGET/release/${{ matrix.executable }}" >> "$GITHUB_ENV"
      - run: cargo +1.93.0 fmt --manifest-path machine-helper/Cargo.toml --check
      - run: cargo +1.93.0 test --manifest-path machine-helper/Cargo.toml --locked
      - name: Prepare disposable Linux user service manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Verify current-user startup registration and removal
        env:
          CONSTELLATION_STARTUP_SMOKE: '1'
        run: cargo +1.93.0 test --manifest-path machine-helper/Cargo.toml --locked --test platform_startup -- --ignored --nocapture
      - run: cargo +1.93.0 clippy --manifest-path machine-helper/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.93.0 build --manifest-path machine-helper/Cargo.toml --release --locked
      - name: Verify the actual Windows executable has no external VC++ runtime dependency
        if: runner.os == 'Windows'
        run: python scripts/check-machine-helper-imports.py --binary "$HELPER_RELEASE_BINARY" --platform "${{ matrix.platform }}"
      - name: Verify the actual Linux executable has no dynamic loader or shared dependencies
        if: runner.os == 'Linux'
        run: python scripts/check-machine-helper-elf.py --binary "$HELPER_RELEASE_BINARY" --platform "${{ matrix.platform }}"
      - name: Verify macOS helper imports only system libraries
        if: runner.os == 'macOS'
        run: python scripts/check-native-macho.py --binary "$HELPER_RELEASE_BINARY" --architecture "${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}"
      - name: Package the native computer helper
        run: python machine-helper/packaging/package.py --binary "$HELPER_RELEASE_BINARY" --platform "${{ matrix.platform }}" --version 0.2.0 --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-helper-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [observatory, machine-helper]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create draft release and attach verified builds
        run: |
          python scripts/package-machine-helpers.py --directory dist
          python scripts/upload-release.py --tag "$RELEASE_TAG" --directory dist
