[package]
name = "constellation-machine-helper"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/microsoft/amplifier-constellation-observatory"
description = "An outbound-only, locally paired computer presence helper for Observatory."

[dependencies]
amplifier-native-platform = { git = "https://github.com/microsoft/amplifier-constellation", rev = "5aaed39b0d1394b182c532f8694e56b919ab5867" }
anyhow = "1"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
