[package]
name = "constellation-machine-helper"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/microsoft/amplifier-constellation-observatory"
description = "An outbound-only, locally paired computer presence helper for Observatory."

[dependencies]
amplifier-native-platform = { git = "https://github.com/microsoft/amplifier-constellation", rev = "849ae7cb7e32979c2f66cb17473be57f83aebea2" }
anyhow = "1"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
